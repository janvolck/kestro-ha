
[metadata]
name = kestro-iot
version = 1.0.0
author = Jan Volckaert
author_email = janvolck@gmail.com
url = https://www.github.com/janvolck/kestro-iot
description = Abstraction layer for network devices that provide access to sensors, displays and I/Os over REST and MQTT
long_description = file: README.md
long_description_content_type = text/markdown
keywords = kestro, iot, raspberrypi, odroid
license = License :: Free For Home Use
classifiers =
    License :: Free For Home Use
    Programming Language :: Python :: 3

[options]
package_dir =
    = python
packages = find:
zip_safe = False
include_package_data = True
install_requires =
    adafruit-blinka
    adafruit-blinka-displayio
    adafruit-circuitpython-dht
    adafruit-circuitpython-display-text
    adafruit_circuitpython_displayio_ssd1306
    adafruit_circuitpython_ds18x20
    adafruit-circuitpython-hcsr04
    adafruit-circuitpython-ina260
    adafruit-circuitpython-mcp230xx
    chevron
    colorama
    flask
    flask-cors
    flask-jsonpify
    flask-restful
    flask-sqlalchemy
    paho-mqtt
    paramiko
    py-spy
    sdbus-networkmanager
    smbus2
    sysv_ipc
    waitress
    zeroconf

[options.packages.find]
where=python

[options.entry_points]
console_scripts =
    kestro_iot = kestro_iot.command_line:main


[options.package_data]
* = webapp/templates/*.html, webapp/templates/*.htm, static/*.*, README.md

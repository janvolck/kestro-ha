[gpio]
devices = mancave.io

[sensors]
devices = mancave.sensor.dht22

[mqtt]
id = kestro_mancave
host = mqtt.kestro.home
port = 1883
birth.messages = mqtt.discovery.homeassistant

[mqtt.discovery.homeassistant]
topic = homeassistant/device/rpi4_mancave/config
payload = {
        "device": {
            "identifiers": ["kestro_mancave"],
            "name": "Mancave",
            "model": "Raspberry Pi 4",
            "sw_version": "1.0.0",
            "suggested_area": "mancave"
        },
        "origin": {
            "name": "kestro-iot",
            "sw_version": "1.0.0"
        },
        "components": {
            "mancave_light_main": {
                "platform": "switch",
                "name": "Mancave Light Main",
                "icon": "mdi:lightbulb",
                "unique_id": "mancave_light_main",
                "command_topic": "kestro/mancave/light/main/control",
                "payload_on": "on",
                "payload_off": "off",
                "state_topic": "kestro/mancave/light/main/state",
                "retain": true
            },
            "mancave_light_front": {
                "platform": "switch",
                "name": "Mancave Light Front",
                "icon": "mdi:lightbulb",
                "unique_id": "mancave_light_front",
                "command_topic": "kestro/mancave/light/front/control",
                "payload_on": "on",
                "payload_off": "off",
                "state_topic": "kestro/mancave/light/front/state",
                "retain": true
            },
            "mancave_light_attic": {
                "platform": "switch",
                "name": "Mancave Light Attic",
                "icon": "mdi:lightbulb",
                "unique_id": "mancave_light_attic",
                "command_topic": "kestro/mancave/light/attic/control",
                "payload_on": "on",
                "payload_off": "off",
                "state_topic": "kestro/mancave/light/attic/state",
                "retain": true
            },
            "mancave_temperature": {
                "platform": "sensor",
                "name": "Mancave Temperature",
                "icon": "mdi:home-thermometer",
                "unique_id": "mancave_temperature",
                "state_topic": "kestro/mancave/sensor/temperature",
                "unit_of_measurement": "°C",
                "device_class": "temperature"
            },
            "mancave_humidity": {
                "platform": "sensor",
                "name": "Mancave Humidity",
                "icon": "mdi:water-percent",
                "unique_id": "mancave_humidity",
                "state_topic": "kestro/mancave/sensor/humidity",
                "unit_of_measurement": "%%",
                "device_class": "humidity"
            },
            "outdoor_light_central": {
                "platform": "switch",
                "name": "Light Central Area",
                "icon": "mdi:lightbulb",
                "unique_id": "outdoor_light_central",
                "command_topic": "kestro/outdoor/light/central/control",
                "payload_on": "on",
                "payload_off": "off",
                "state_topic": "kestro/outdoor/light/central/state",
                "retain": true
            },
            "outdoor_light_camping": {
                "platform": "switch",
                "name": "Light Camping",
                "icon": "mdi:lightbulb",
                "unique_id": "outdoor_light_camping",
                "command_topic": "kestro/outdoor/light/camping/control",
                "payload_on": "on",
                "payload_off": "off",
                "state_topic": "kestro/outdoor/light/camping/state",
                "retain": true
            },
            "outdoor_gate_control": {
                "platform": "button",
                "name": "Gate Control",
                "icon": "mdi:gate",
                "unique_id": "outdoor_gate_control",
                "command_topic": "kestro/outdoor/gate/control/control",
                "payload_press": "push",
                "retain": false
            },
            "outdoor_gate_sensor": {
                "platform": "binary_sensor",
                "name": "Gate Sensor",
                "icon": "mdi:gate-arrow-right",
                "unique_id": "outdoor_gate_sensor",
                "payload_on": "on",
                "payload_off": "off",
                "state_topic": "kestro/outdoor/gate/sensor/state"
            }
        }
    }


[mqtt.properties]
mancave.sensor.dht22.temperature = kestro/mancave/sensor/temperature
mancave.sensor.dht22.humidity = kestro/mancave/sensor/humidity

[mqtt.states]
mancave.light.main = kestro/mancave/light/main/state
mancave.light.front = kestro/mancave/light/front/state
mancave.light.attic = kestro/mancave/light/attic/state
outdoor.light.central = kestro/outdoor/light/central/state
outdoor.light.camping = kestro/outdoor/light/camping/state
outdoor.gate.control = kestro/outdoor/gate/control/state
outdoor.gate.sensor = kestro/outdoor/gate/sensor/state

[mqtt.controls]
mancave.light.main = kestro/mancave/light/main/control
mancave.light.front = kestro/mancave/light/front/control
mancave.light.attic = kestro/mancave/light/attic/control
outdoor.light.central = kestro/outdoor/light/central/control
outdoor.light.camping = kestro/outdoor/light/camping/control
outdoor.gate.control = kestro/outdoor/gate/control/control

[mancave.sensor.dht22]
type = dht22
pin = D2

[mancave.io]
type = board
D5 = mancave.light.main
D6 = mancave.light.front
D9 = outdoor.gate.control
D11 = outdoor.gate.sensor
D13 = mancave.light.attic
D16 = outdoor.light.central
D19 = outdoor.light.camping
D20 = mancave.relay.channel.6
D21 = mancave.relay.channel.7
D26 = mancave.relay.channel.8

[mancave.light.main]
mode = output
value = false
invert_value = true

[mancave.light.front]
mode = output
value = false
invert_value = true

[mancave.light.attic]
mode = output
value = false
invert_value = true

[outdoor.light.central]
mode = output
value = false
invert_value = true

[outdoor.light.camping]
mode = output
value = false
invert_value = true

[mancave.relay.channel.6]
mode = output
value = false
invert_value = true

[mancave.relay.channel.7]
mode = output
value = false
invert_value = true

[mancave.relay.channel.8]
mode = output
value = false
invert_value = true

[outdoor.gate.control]
mode = output
value = false
invert_value = false

[outdoor.gate.sensor]
mode = pulses
state = UP
intervals = outdoor.gate.sensor.opening, outdoor.gate.sensor.closing

[outdoor.gate.sensor.opening]
interval = 0.5
value_busy = opening
value_finished = open

[outdoor.gate.sensor.closing]
interval = 1.0
value_busy = closing
value_finished = closed
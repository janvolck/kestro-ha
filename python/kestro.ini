[network]
lan = end0

[displays]
devices = ssd1306

[gpio]
devices = mcp23017

[sensors]
devices = dht22

[ssd1306]
type = ssd1306
connection = i2c
address = 0x3C
width = 128
height = 32
text_format = {{ ip_addr }}\nKestro: {{ button1 }}

# [powersensor]
# type = ina260

[dht22]
type = dht22
pin = D7


# [distancesensor]
# type = hc-sr04
# trigger_pin = D15
# echo_pin = D13

[mcp23017]
type = mcp23017
address = 0x20
gpa7 = button1
gpb0 = led1

[button1]
mode = input
state = UP

[led1]
mode = output
value = false


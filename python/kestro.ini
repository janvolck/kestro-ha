# [network]
# interfaces = odroidc4.network.lan
# interfaces = tuxedo.network.wifi

[odroidc4.network.lan]
name = lan
interface = end0

[tuxedo.network.wifi]
name = wifi
interface = wlo1

[displays]
# devices = odroidc4.display.hd44780

[gpio]
# devices = odroidc4.io
devices = mancave.io

[sensors]
# devices = odroidc4.sensor.dht22

[mqtt]
id = KestroMancave
host = mqtt.kestro.home
port = 1883

[mqtt.propertytopics]
tuxedo.network.wifi = kestro/odroidc4/wifi
odroidc4.io.button1 = kestro/input/button1
odroidc4.io.led1 = kestro/output/led1
odroidc4.sensor.dht22 = kestro/sensor/temperature


[odroidc4.display.ssd1306]
type = ssd1306
connection = i2c
address = 0x3C
width = 128
height = 32
text_format = {{ local_address }}\nKestro: {{ odroidc4_io_button1 }}


[odroidc4.display.hd44780]
type = hd44780
db0 = D8
db1 = D10
db2 = D12
db3 = D16
db4 = D18
db5 = D22
db6 = D26
db7 = D28
rs = D11
enable = D7
cols = 16
rows = 2
text_format = {{ local_address }}\nKestro

# [powersensor]
# type = ina260

[odroidc4.sensor.dht22]
type = dht22
pin = D7


# [distancesensor]
# type = hc-sr04
# trigger_pin = D15
# echo_pin = D13

[odroidc4.io]
type = mcp23017
address = 0x20
gpa7 = odroidc4.io.button1
gpb0 = odroidc4.io.led1

[odroidc4.io.button1]
mode = input
state = UP

[odroidc4.io.led1]
mode = output
value = false

[mancave.io]
type = board
D5 = mancave.light.main
D6 = mancave.light.gate
D13 = mancave.light.attic
D16 = outdoor.light.central
D19 = outdoor.light.camping
D20 = mancave.relay.channel.6
D21 = mancave.relay.channel.7
D26 = mancave.relay.channel.8

[mancave.light.main]
mode = output
value = false
invert_value = true

[mancave.light.gate]
mode = output
value = false
invert_value = true

[mancave.light.attic]
mode = output
value = false
invert_value = true

[outdoor.light.central]
mode = output
value = false
invert_value = true

[outdoor.light.camping]
mode = output
value = false
invert_value = true

[mancave.relay.channel.6]
mode = output
value = false
invert_value = true

[mancave.relay.channel.7]
mode = output
value = false
invert_value = true

[mancave.relay.channel.8]
mode = output
value = false
invert_value = true
